:root{--bg:#f5f7fa;--surface:#ffffff;--ink:#0f172a;--muted:#475569;--line:#dbe1ea;--accent:#1d4ed8;--accent-ink:#ffffff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1220;--surface:#121a2b;--ink:#e6ebf5;--muted:#93a1b8;--line:#223049;--accent:#6ea8ff;--accent-ink:#07142e}}
:root[data-theme="dark"]{--bg:#0b1220;--surface:#121a2b;--ink:#e6ebf5;--muted:#93a1b8;--line:#223049;--accent:#6ea8ff;--accent-ink:#07142e}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 64px);color-scheme:light dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.65 'Newsreader',Georgia,serif}
main{max-width:860px;margin:0 auto;padding:0 22px 64px}
h1,h2,h3,.sans{font-family:'Space Grotesk',system-ui,sans-serif}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--bg);border-bottom:1px solid var(--line)}
.nav-in{max-width:860px;margin:0 auto;padding:0 22px;display:flex;align-items:center;justify-content:space-between;gap:16px;height:56px}
.brand{font-family:'Space Grotesk',system-ui,sans-serif;font-weight:700;color:var(--ink);text-decoration:none;white-space:nowrap}
.nav-links{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.nav-links a{font-family:'Space Grotesk',system-ui,sans-serif;font-size:.92rem;color:var(--muted);text-decoration:none;padding:8px 10px;border-radius:6px;white-space:nowrap}
.nav-links a:hover{color:var(--ink);background:var(--surface)}
.nav-links a:focus-visible,.brand:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
header{padding:72px 0 40px}
h1{font-size:clamp(2.4rem,8vw,4.4rem);line-height:1.02;margin:0 0 18px;letter-spacing:-.03em;font-weight:700}
.tag{font-size:1.2rem;color:var(--muted);max-width:34em;margin:0 0 24px}
.links{display:flex;flex-wrap:wrap;gap:10px}
.links a{font-family:'Space Grotesk',system-ui,sans-serif;font-size:.95rem;padding:10px 18px;border:1px solid var(--line);border-radius:999px;color:var(--ink);text-decoration:none}
.links a.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.links a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
section{padding:38px 0;border-top:1px solid var(--line)}
h2{font-size:1.6rem;margin:0 0 20px;letter-spacing:-.01em}
.scores{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}
.score{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px}
.score b{display:block;font-family:'Space Grotesk',sans-serif;font-size:1.7rem;color:var(--accent);line-height:1.2}
.score span{color:var(--muted);font-size:.95rem}
.item{margin-bottom:26px}
.item h3{margin:0;font-size:1.15rem}
.meta{color:var(--muted);font-size:.95rem;margin:2px 0 8px}
.item p,.item ul{margin:0 0 8px}
.item ul{padding-left:20px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;padding:0;list-style:none}
.chips li{font-family:'Space Grotesk',sans-serif;font-size:.85rem;padding:4px 12px;border:1px solid var(--line);border-radius:999px;background:var(--surface)}
.skills{display:flex;flex-wrap:wrap;gap:8px;padding:0;margin:0;list-style:none}
.skills li{font-family:'Space Grotesk',sans-serif;padding:7px 14px;border-radius:8px;background:var(--surface);border:1px solid var(--line)}
.proj{display:grid;grid-template-columns:200px 1fr;gap:22px;align-items:start}
.shot{width:200px;height:200px;object-fit:cover;border-radius:10px;border:1px solid var(--line);display:block}
.menu-btn{display:none;background:none;border:1px solid var(--line);border-radius:8px;width:42px;height:38px;color:var(--ink);cursor:pointer;padding:0}
.menu-btn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
.menu-btn:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
@media (max-width:700px){
body{font-size:16px}
header{padding:44px 0 28px}
section{padding:30px 0}
.menu-btn{display:inline-flex;align-items:center;justify-content:center}
.nav-links{display:none;position:absolute;left:0;right:0;top:56px;flex-direction:column;gap:0;background:var(--bg);border-bottom:1px solid var(--line);padding:6px 22px 12px}
nav.open .nav-links{display:flex}
.nav-links a{padding:12px 4px;font-size:1rem;border-radius:0;border-bottom:1px solid var(--line)}
.nav-links a:last-child{border-bottom:0}
.proj{grid-template-columns:1fr;gap:14px}
.shot{width:100%;max-width:320px;height:auto;aspect-ratio:1/1}
.links a{flex:1 1 auto;text-align:center}
}
footer{color:var(--muted);font-size:.9rem;padding-top:24px;border-top:1px solid var(--line)}
@media (prefers-reduced-motion:no-preference){header{animation:in .6s ease both}@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}}
</style>
